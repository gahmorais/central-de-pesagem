plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt' apply true
    id 'com.google.devtools.ksp'
}

android {
    namespace "br.com.backupautomacao.pesagem_modular"
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    compileSdk 35
    defaultConfig {

        applicationId "br.com.backupautomacao.pesagem_modular"
        minSdk 24
        targetSdk 35
        versionCode 19
        versionName "1.5.4"
        resValue "string", "app_name", "Pesagem Modular"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    dataBinding {
        enabled = true
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            setProperty("archivesBaseName", "PESAGEM_MODULAR_v${defaultConfig.versionName}_${defaultConfig.versionCode}")
            resValue "string", "app_name", "Pesagem Modular v${defaultConfig.versionName}"
        }
        debug{
            applicationIdSuffix ".app"

        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    //UI + Core
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.5.4'

    //Room
    def roomVersion = "2.6.1"
    implementation "androidx.room:room-ktx:$roomVersion"
//    kapt "androidx.room:room-compiler:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"
    androidTestImplementation "androidx.room:room-testing:$roomVersion"

    //WorkManager
    def work_version = "2.10.1"
    implementation("androidx.work:work-runtime-ktx:$work_version")

    //Lifecycle
    def lifecycleVersion = "2.3.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycleVersion"

    //Network
    implementation("com.google.code.gson:gson:2.10")
    implementation("com.squareup.retrofit2:converter-gson:2.9.0")
    implementation("com.squareup.retrofit2:retrofit:2.9.0")
    implementation("com.squareup.okhttp3:logging-interceptor:4.10.0")

    //Dependecies Injection
    def koin_version = "3.5.6"
    def koin_android_version= "3.5.6"
    implementation "io.insert-koin:koin-android:$koin_android_version"
    implementation "io.insert-koin:koin-core:$koin_version"
    testImplementation "io.insert-koin:koin-test:$koin_version"

    //Speech Recognizer
    implementation 'net.gotev:speech:1.6.2'
    implementation 'com.jakewharton.timber:timber:5.0.1'

    //Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.4'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation project(path: ':bluetooth')

    //usb
    implementation "com.github.EmHaseeb:ThermalPrinterESCPOS:1.0.2"

    //Vazamento de memória
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    implementation fileTree(include: ['*.jar'], dir: 'libs')

}